    // ==========================================
    // 2. ERROR BOUNDARY
    // ==========================================
    class ErrorBoundary extends Component {
      constructor(props) {
        super(props);
        this.state = { hasError: false };
      }
      static getDerivedStateFromError(error) {
        return { hasError: true };
      }
      componentDidCatch(error, errorInfo) {
        console.error('ErrorBoundary caught:', error, errorInfo);
      }
      render() {
        if (this.state.hasError) {
          return (
            <div className="min-h-screen bg-gray-100 flex flex-col items-center justify-center p-6 text-center">
              <div className="bg-white p-8 rounded-2xl shadow-xl max-w-md w-full border border-gray-200 space-y-4">
                <div className="w-16 h-16 bg-red-100 text-bms-red rounded-full flex items-center justify-center mx-auto text-2xl font-bold">
                  <i className="fa-solid fa-triangle-exclamation"></i>
                </div>
                <h2 className="text-xl font-black text-gray-900">Something went wrong</h2>
                <p className="text-xs text-gray-500">
                  An unexpected UI issue occurred. Click below to reload BookMySeat smoothly.
                </p>
                <button
                  onClick={() => { this.setState({ hasError: false }); window.location.reload(); }}
                  className="w-full bg-bms-red hover:bg-red-600 text-white font-bold py-2.5 rounded-xl text-sm transition"
                >
                  Reload BookMySeat
                </button>
              </div>
            </div>
          );
        }
        return this.props.children;
      }
    }

      const [showTicketModal, setShowTicketModal] = useState(false);

      const [targetSeatCount, setTargetSeatCount] = useState(5);

      const [selectedSeatData, setSelectedSeatData] = useState(null);
      const [latestBooking, setLatestBooking] = useState(null);

      const heroMovies = movies.slice(0, 4);

      useEffect(() => {
        if (heroMovies.length === 0) return;
        const timer = setInterval(() => {
          setHeroIndex((prev) => (prev + 1) % heroMovies.length);
        }, 5000);
        return () => clearInterval(timer);
      }, [heroMovies.length]);

        setSelectedCity(city);
        if (city === 'Chennai') setSelectedLanguage('Tamil');
        else if (city === 'Delhi-NCR' || city === 'Mumbai' || city === 'Ahmedabad' || city === 'Chandigarh') setSelectedLanguage('Hindi');
        else if (city === 'Hyderabad') setSelectedLanguage('Telugu');
        else if (city === 'Kochi') setSelectedLanguage('Malayalam');
        else setSelectedLanguage('All');
      };

      const handleSelectMovieForBooking = (movie) => {
        setSelectedMovie(movie);
        setShowLangFormatModal(true);
      };

      const handleConfirmLanguageFormat = (lang, format) => {
        setSelectedFormatPref({ lang, format });
        setShowLangFormatModal(false);

          return matchQuery && matchLang && matchGenre;

    // --- Sidebar Filters Component ---
    function SidebarFiltersComponent({
      selectedLanguage,
      setSelectedLanguage,
      selectedGenre,
      setSelectedGenre,
      selectedFormat,
      setSelectedFormat,
      onClearFilters
    }) {
      const [openLanguages, setOpenLanguages] = useState(true);
      const [openGenres, setOpenGenres] = useState(true);
      const [openFormats, setOpenFormats] = useState(true);

      const languages = ['Tamil', 'Hindi', 'Telugu', 'Malayalam', 'English'];
      const genres = ['Action', 'Sci-Fi', 'Comedy', 'Thriller', 'Drama', 'Romance', 'Superhero', 'Crime'];
      const formats = ['2D', '3D', 'IMAX 3D'];

      const hasActiveFilters = selectedLanguage !== 'All' || selectedGenre !== 'All' || selectedFormat !== 'All';

      return (
        <aside className="w-full lg:w-64 space-y-4 flex-shrink-0">
          <div className="flex items-center justify-between">
            <h3 className="text-xl font-bold text-gray-900 flex items-center gap-2">
              <i className="fa-solid fa-sliders text-bms-red"></i>
              <span>Filters</span>
            </h3>

            {hasActiveFilters && (
              <button
                onClick={onClearFilters}
                className="text-xs font-semibold text-bms-red hover:underline flex items-center gap-1 cursor-pointer"
              >
                <i className="fa-solid fa-xmark text-xs"></i>
                <span>Clear All</span>
              </button>
            )}
          </div>

          {/* 1. LANGUAGES FILTER CARD */}
          <div className="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
            <button
              onClick={() => setOpenLanguages(!openLanguages)}
              className="w-full p-4 flex items-center justify-between font-bold text-sm text-bms-red bg-white border-b border-gray-100 cursor-pointer"
            >
              <span className="flex items-center gap-1.5">
                Languages
                {selectedLanguage !== 'All' && (
                  <span className="bg-bms-red text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold">1</span>
                )}
              </span>
              <i className={`fa-solid ${openLanguages ? 'fa-chevron-up' : 'fa-chevron-down'} text-gray-400 text-xs`}></i>
            </button>

            {openLanguages && (
              <div className="p-4 space-y-3">
                <div className="flex justify-between items-center text-[11px] text-gray-400">
                  <span>Select language:</span>
                  <button
                    onClick={() => setSelectedLanguage('All')}
                    className="text-bms-red hover:underline font-semibold cursor-pointer"
                  >
                    Clear
                  </button>
                </div>

                <div className="flex flex-wrap gap-2">
                  {languages.map((lang) => {
                    const isSelected = selectedLanguage === lang;
                    return (
                      <button
                        key={lang}
                        onClick={() => setSelectedLanguage(isSelected ? 'All' : lang)}
                        className={`px-3 py-1.5 rounded-md text-xs font-semibold border transition cursor-pointer ${
                          isSelected
                            ? 'border-bms-red bg-red-50 text-bms-red shadow-sm'
                            : 'border-gray-200 hover:border-bms-red text-gray-700 hover:bg-gray-50'
                        }`}
                      >
                        {lang}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </div>

          {/* 2. GENRES FILTER CARD */}
          <div className="bg-white rounded-xl border border-gray-200 overflow-hidden shadow-sm">
            <button
              onClick={() => setOpenGenres(!openGenres)}
              className="w-full p-4 flex items-center justify-between font-bold text-sm text-gray-800 bg-white border-b border-gray-100 cursor-pointer"
            >
              <span className="flex items-center gap-1.5">
                Genres
                {selectedGenre !== 'All' && (
                  <span className="bg-bms-red text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold">1</span>
                )}

              <i className={`fa-solid ${openGenres ? 'fa-chevron-up' : 'fa-chevron-down'} text-gray-400 text-xs`}></i>
            </button>

            {openGenres && (
              <div className="p-4 space-y-3">
                <div className="flex justify-between items-center text-[11px] text-gray-400">
                  <span>Select genre:</span>
                  <button
                    onClick={() => setSelectedGenre('All')}
                    className="text-bms-red hover:underline font-semibold cursor-pointer"
                  >
                    Clear
                  </button>
                </div>

                <div className="flex flex-wrap gap-2">
                  {genres.map((g) => {
                    const isSelected = selectedGenre === g;
                    return (
                      <button
                        key={g}
                        onClick={() => setSelectedGenre(isSelected ? 'All' : g)}
                        className={`px-3 py-1.5 rounded-md text-xs font-semibold border transition cursor-pointer ${

              <span className="flex items-center gap-1.5">

                  <span className="bg-bms-red text-white text-[10px] px-1.5 py-0.2 rounded-full font-bold">1</span>

            </button>

            {openFormats && (
              <div className="p-4 space-y-3">
                <div className="flex justify-between items-center text-[11px] text-gray-400">
                  <span>Select format:</span>
                  <button
                    onClick={() => setSelectedFormat('All')}
                    className="text-bms-red hover:underline font-semibold cursor-pointer"
                  >
                    Clear
                  </button>
                </div>

                <div className="flex flex-wrap gap-2">
                  {formats.map((f) => {
                    const isSelected = selectedFormat === f;
                    return (
                      <button
                        key={f}
                        onClick={() => setSelectedFormat(isSelected ? 'All' : f)}

                          isSelected
                            ? 'border-bms-red bg-red-50 text-bms-red shadow-sm ring-2 ring-red-200'
                            : 'border-gray-300 hover:border-bms-red text-gray-700 hover:bg-gray-50'
                        }`}
                      >
                        {f}
                      </button>
                    );
                  })}
                </div>
              </div>
            )}
          </div>

          <div className="pt-2">
            <button className="w-full py-3 rounded-xl border-2 border-bms-red text-bms-red hover:bg-red-50 text-xs font-bold transition cursor-pointer">
              Browse by Cinemas
            </button>
          </div>
        </aside>
      );

    // --- Interactive Seat Picker View (Exact visual match with media_1789141645542.png) ---
    function SeatPickerView({ movie, formatPref, showtime, theater, targetSeatCount, targetCategory, onBack, onProceedToCheckout }) {
      const [activeCategory, setActiveCategory] = useState(targetCategory || 'DIAMOND');
      const [categoryWarning, setCategoryWarning] = useState('');
      const [selectedSeatIds, setSelectedSeatIds] = useState([]);

      // Seat matrix generator matching BMS layout
      const allSeats = useMemo(() => {
        const list = [];
        let idCounter = 1000;
        const rows = [
          { prefix: 'A', cat: 'DIAMOND', count: 12 },
          { prefix: 'B', cat: 'DIAMOND', count: 12 },
          { prefix: 'C', cat: 'DIAMOND', count: 12 },
          { prefix: 'D', cat: 'DIAMOND', count: 12 },
          { prefix: 'E', cat: 'DIAMOND', count: 12 },
          { prefix: 'M', cat: 'PEARL', count: 10 },
          { prefix: 'N', cat: 'PEARL', count: 10 }
        ];

        for (const r of rows) {
          for (let i = 1; i <= r.count; i++) {
            idCounter++;
            const seatNum = `${r.prefix}${i < 10 ? '0' + i : i}`;
            // Realistic booked/sold seats matching screenshot (A04, A05, B03, C07, E01, E02, M06, etc.)
            const isBooked = 
              (r.prefix === 'A' && (i === 4 || i === 5 || i === 11)) ||
              (r.prefix === 'B' && i === 3) ||
              (r.prefix === 'C' && (i === 5 || i === 7)) ||
              (r.prefix === 'E' && (i === 1 || i === 2 || i === 8)) ||
              (r.prefix === 'M' && (i === 5 || i === 6 || i === 7 || i === 10));

            list.push({
              seat_id: idCounter,
              seat_number: seatNum,
              seat_category: r.cat,
              is_booked: isBooked ? 1 : 0
            });
          }
        }
        return list;
      }, []);

      // Auto-select preferred seats initially
      useEffect(() => {
        const available = allSeats.filter(s => s.is_booked === 0 && s.seat_category === activeCategory);
        const toSelect = available.slice(0, targetSeatCount || 1).map(s => s.seat_id);
        setSelectedSeatIds(toSelect);
      }, [activeCategory, targetSeatCount, allSeats]);

      const toggleSeat = (seat) => {
        if (!seat || seat.is_booked === 1) return;
        setCategoryWarning('');

        // Preference Protection
        if (seat.seat_category !== activeCategory) {
          setCategoryWarning(`Notice: Your chosen preference was ${activeCategory}. You clicked a ${seat.seat_category} seat.`);
          const switchConfirm = window.confirm(
            `Your chosen preference was ${activeCategory}. Do you want to switch your category selection to ${seat.seat_category}?`
          );

          if (switchConfirm) {
            setActiveCategory(seat.seat_category);
            setSelectedSeatIds([seat.seat_id]);
            setCategoryWarning(`Category switched to ${seat.seat_category}.`);
          }
          return;
        }

        if (selectedSeatIds.includes(seat.seat_id)) {
          setSelectedSeatIds(selectedSeatIds.filter(id => id !== seat.seat_id));
        } else {
          if (selectedSeatIds.length >= 10) {
            alert('Maximum 10 seats allowed per booking.');
            return;
          }
          setSelectedSeatIds([...selectedSeatIds, seat.seat_id]);
        }
      };

      const selectedSeatsList = allSeats.filter(s => selectedSeatIds.includes(s.seat_id));
      const totalPrice = selectedSeatsList.reduce((sum, seat) => {
        return sum + (seat.seat_category === 'DIAMOND' ? (showtime.price_prime || 200) : (showtime.price_classic || 59));
      }, 0);

      const diamondSeats = allSeats.filter(s => s.seat_category === 'DIAMOND');
      const pearlSeats = allSeats.filter(s => s.seat_category === 'PEARL');

      const renderGrid = (seatArray, catName) => {
        const rows = {};
        seatArray.forEach(s => {
          const rowLetter = s.seat_number.charAt(0);
          if (!rows[rowLetter]) rows[rowLetter] = [];
          rows[rowLetter].push(s);
        });

        const isCurrentActive = activeCategory === catName;

        return Object.keys(rows).map(rowLetter => (
          <div key={rowLetter} className="flex items-center justify-center gap-3 my-1.5">
            <span className="w-6 font-bold text-xs text-gray-400 text-center">{rowLetter}</span>
            <div className="flex items-center gap-1.5 flex-wrap justify-center">
              {rows[rowLetter].map(seat => {
                const isSelected = selectedSeatIds.includes(seat.seat_id);
                const isBooked = seat.is_booked === 1;

                return (
                  <button
                    key={seat.seat_id}
                    disabled={isBooked}
                    onClick={() => toggleSeat(seat)}
                    className={`w-7 h-7 md:w-8 md:h-8 rounded-md font-semibold text-[11px] flex items-center justify-center transition cursor-pointer ${
                      isBooked
                        ? 'bg-gray-100 text-gray-300 border border-gray-200 opacity-60 cursor-not-allowed filter blur-[0.2px]'
                        : isSelected
                        ? 'bg-emerald-600 text-white border-2 border-emerald-700 font-bold shadow-md scale-105'
                        : isCurrentActive
                        ? 'bg-white hover:bg-emerald-50 text-emerald-600 border border-emerald-500'
                        : 'bg-white hover:bg-amber-50 text-gray-600 border border-gray-300 opacity-90'
                    }`}
                  >
                    {seat.seat_number.slice(1)}
                  </button>
                );
              })}
            </div>
          </div>
        ));
      };

      return (
        <div className="min-h-screen bg-gray-100 text-gray-900 pb-32">
          
          {/* Top Header Bar matching BMS screenshot */}
          <div className="bg-white p-4 border-b border-gray-200 sticky top-0 z-30 shadow-sm">

                <button onClick={onBack} className="p-2 hover:bg-gray-100 rounded-full transition cursor-pointer">
                  <i className="fa-solid fa-arrow-left text-gray-700"></i>
                </button>
                <div>
                  <h2 className="font-bold text-base text-gray-900 leading-tight">
                    {movie.title} - {formatPref.lang} / {movie.language}
                  </h2>
                  <p className="text-xs text-gray-500">
                    {theater.name} | {showtime.show_date || '2026-09-14'} | {showtime.show_time}
                  </p>
                </div>
              </div>

              <div className="flex items-center gap-3">
                <div className="border border-bms-red text-bms-red font-bold text-xs px-3 py-1.5 rounded-lg flex items-center gap-1 shadow-sm">
                  <span>✏️ {selectedSeatIds.length} Tickets ({activeCategory})</span>
                </div>
              </div>
            </div>
          </div>

          {/* Preference Warning Banner */}
          {categoryWarning && (
            <div className="bg-amber-500 text-white py-2.5 px-4 text-center text-xs font-bold shadow-md flex items-center justify-center gap-2 animate-fadeIn">
              <i className="fa-solid fa-circle-exclamation text-white"></i>
              <span>{categoryWarning}</span>
            </div>
          )}

          {/* Showtime Switcher Pill */}

              <button className="px-4 py-1 bg-emerald-600 text-white rounded text-xs font-bold shadow">
                {showtime.show_time}
              </button>
            </div>
          </div>

-- ORACLE SQL DDL SCHEMA SCRIPT: BOOKMYSEAT
-- ==========================================
CREATE TABLE MOVIES (

);

CREATE TABLE SHOWTIMES (

    seat_number VARCHAR2(10) NOT NULL,

CREATE TABLE BOOKINGS (

);`;

      const dmlCode = `-- ==========================================
-- ORACLE SQL DML CRUD QUERIES: BOOKMYSEAT
-- ==========================================

-- 1. SELECT MOVIES BY LANGUAGE
SELECT * FROM MOVIES WHERE language = 'Tamil' ORDER BY rating DESC;

-- 2. JOIN: SHOWTIMES WITH THEATER & MOVIE DETAILS
SELECT m.title, m.language, t.name AS theater_name, s.show_time, s.price_prime, s.price_classic
FROM SHOWTIMES s
JOIN MOVIES m ON s.movie_id = m.movie_id
JOIN THEATERS t ON s.theater_id = t.theater_id
WHERE s.show_date = 'Today';

-- 3. SEAT AVAILABILITY COUNT PER SHOWTIME
SELECT s.showtime_id, st.seat_category, COUNT(*) AS available_seats
FROM SEATS st
JOIN SHOWTIMES s ON st.showtime_id = s.showtime_id
WHERE st.is_booked = 0
GROUP BY s.showtime_id, st.seat_category;

                <h3 className="text-base font-black text-white">Oracle SQL Schema & Query Console</h3>
              </div>
              <button onClick={onClose} className="text-gray-400 hover:text-white p-1">
                <i className="fa-solid fa-xmark text-lg"></i>
              </button>
            </div>

            <div className="flex gap-2 pt-3">
              <button
                onClick={() => setActiveTab('schema')}
                className={`px-4 py-1.5 rounded-lg text-xs font-bold transition ${
                  activeTab === 'schema' ? 'bg-amber-400 text-gray-900' : 'bg-gray-800 text-gray-400 hover:text-white'
                }`}
              >
                DDL Schema (Tables & Foreign Keys)
              </button>
              <button
                onClick={() => setActiveTab('queries')}
                className={`px-4 py-1.5 rounded-lg text-xs font-bold transition ${
                  activeTab === 'queries' ? 'bg-amber-400 text-gray-900' : 'bg-gray-800 text-gray-400 hover:text-white'
                }`}
              >
                DML Queries (JOINs & Aggregations)
              </button>
            </div>

            <div className="mt-4 flex-1 overflow-y-auto bg-black p-4 rounded-xl font-mono text-xs text-emerald-400 border border-gray-800">
              <pre className="whitespace-pre-wrap">{activeTab === 'schema' ? ddlCode : dmlCode}</pre>
            </div>

            <div className="pt-3 flex justify-between items-center text-xs text-gray-400">
              <span>Included for lab examination & academic project evaluation</span>
              <button onClick={onClose} className="bg-gray-800 hover:bg-gray-700 text-white font-bold px-4 py-1.5 rounded-lg">
                Close
              </button>
            </div>
          </div>
        </div>
      );
    }

    // ==========================================
    // 5. RENDER APPLICATION
    // ==========================================
    ReactDOM.createRoot(document.getElementById('root')).render(
      <React.StrictMode>
        <ErrorBoundary>
          <App />
        </ErrorBoundary>
      </React.StrictMode>
    );
  </script>
</body>
</html>
